<style>
  :root {
    --royal: #0B4EA2;
    --sky: #4BBEF5;
    --sun: #FFCC00;
    --sand: #FFF8EC;
    --ink: #0B2545;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Nunito Sans', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #BFE7FC 0%, #E4F5FE 50%, var(--sand) 100%);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 20px 48px;
    gap: 28px;
  }
  .logo {
    width: 100%;
    max-width: 520px;
    height: auto;
    filter: drop-shadow(0 10px 18px rgba(11, 78, 162, .15));
  }
  h1 {
    margin: 0;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 5vw, 52px);
    line-height: 1.05;
    color: var(--royal);
  }
  p.lede {
    margin: 0;
    max-width: 560px;
    font-size: clamp(17px, 2.2vw, 20px);
    line-height: 1.65;
  }
  .badge {
    display: inline-block;
    background: var(--sun);
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 999px;
  }
  .waves {
    display: block;
    width: 100%;
    height: 70px;
  }
  footer {
    background: var(--royal);
    color: #DCEBFA;
    text-align: center;
    padding: 22px 20px 26px;
    font-size: 14px;
  }
</style>
</head>
